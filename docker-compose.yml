version: "3.9"

services:
  postgres:
    build: ./db
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: motorcycles
      POSTGRES_USER: user
      POSTGRES_PASSWORD: strongPassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - privateNetwork

  pgAdmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: strongPassword
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - privateNetwork

  api:
    build: ./server
    container_name: api
    ports:
      - "8080:8080"
    volumes:
      - ./server:/app
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - privateNetwork
      - publicNetwork

  client:
    build: ./client
    container_name: web-app
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - ./media:/app/public/media
      - node_modules:/app/node_modules
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - publicNetwork

volumes:
  postgres_data:
  node_modules:

networks:
  privateNetwork:
    driver: bridge
  publicNetwork:
    driver: bridge
